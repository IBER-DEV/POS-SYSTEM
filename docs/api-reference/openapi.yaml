      operationId: brands_retrieve
      description: |-
        Shared behaviour for every tenant-scoped endpoint.

        The queryset is already filtered by the TenantManager; this mixin adds the
        capability check and injects the organization on write.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un Cadena UUID que identifique este brand.
        required: true
      tags:
      - brands
      security:
      - organizationJWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
          description: ''
    put:
      operationId: brands_update
      description: |-
        Shared behaviour for every tenant-scoped endpoint.

