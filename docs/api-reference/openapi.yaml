openapi: 3.0.3
info:
  title: Retail POS SaaS API
  version: 1.0.0
  description: Multi-tenant backend for fashion retail point of sale.
paths:
  /api/v1/auth/invitations/{token}/:
    get:
      operationId: auth_invitations_retrieve
      description: Lo que ve quien abre el enlace, antes de decidir si acepta.
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreview'
          description: ''
  /api/v1/auth/invitations/accept/:
    post:
      operationId: auth_invitations_accept_create
      description: |-
        Liquida el token y crea la membresía.

        Si el correo ya tiene cuenta se reutiliza esa identidad y no se toca su
        contraseña: aceptar una invitación no puede ser una forma de cambiársela.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationAcceptRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InvitationAcceptRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InvitationAcceptRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          description: No response body
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Iniciar sesión, por cualquiera de los dos caminos.

        El orden importa: si la petición dice de qué negocio se trata (terminal
        registrada o slug), se resuelve ahí mismo y se devuelve una sesión. Solo
        cuando no lo dice se cae al camino de identidad global, que responde con la
        lista de negocios para que el cliente elija.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: La sesión actual, releída de la base de datos.
      tags:
      - auth
      security:
      - organizationJWT: []
      responses:
        '200':
          description: No response body
    patch:
      operationId: auth_me_partial_update
      description: La sesión actual, releída de la base de datos.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
      security:
      - organizationJWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/organizations/:
    get:
      operationId: auth_organizations_list
      description: |-
        Los negocios en los que puede trabajar quien pregunta.

        Vale tanto con un token de identidad como con uno de sesión: cambiar de
        negocio no debe obligar a volver a escribir la contraseña.
      tags:
      - auth
      security:
      - organizationJWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MembershipBrief'
          description: ''
  /api/v1/auth/organizations/new/:
    post:
      operationId: auth_organizations_new_create
      description: |-
        Un negocio más para quien ya tiene cuenta. Esto es lo que hace útil el SSO.

        No exige contexto de tenant: se llega aquí con un token de identidad o con
        la sesión de otro negocio, y se sale con la sesión del negocio nuevo.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrganizationCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrganizationCreateRequest'
        required: true
      security:
      - organizationJWT: []
      responses:
        '201':
          description: No response body
  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: |-
        Refresco estándar.

        simplejwt copia los claims personalizados del refresh al access que emite,
        así que la organización sobrevive al refresco sin código propio - y sigue
        revalidándose contra la membresía en cada petición.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      description: 'Alta por cuenta propia: crea la cuenta global y su primer negocio.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          description: No response body
  /api/v1/auth/select-organization/:
    post:
      operationId: auth_select_organization_create
      description: |-
        Elegir negocio, o cambiar de negocio. Es la misma operación.

        La membresía se revalida aquí y otra vez en cada petición posterior, así que
        este endpoint no otorga nada que la autenticación no vuelva a comprobar.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectOrganizationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SelectOrganizationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SelectOrganizationRequest'
        required: true
      security:
      - organizationJWT: []
      responses:
        '200':
          description: No response body
  /api/v1/brands/:
    get:
      operationId: brands_list
      description: |-
        Shared behaviour for every tenant-scoped endpoint.

        The queryset is already filtered by the TenantManager; this mixin adds the
        capability check and injects the organization on write.
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      tags:
      - brands
      security:
      - organizationJWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBrandList'
          description: ''
    post:
      operationId: brands_create
      description: |-
        Shared behaviour for every tenant-scoped endpoint.

        The queryset is already filtered by the TenantManager; this mixin adds the
        capability check and injects the organization on write.
      tags:
      - brands
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BrandRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BrandRequest'
        required: true
      security:
