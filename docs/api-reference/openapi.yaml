  /api/v1/cash/movements/:
    get:
      operationId: cash_movements_list
      description: |-
        Shared behaviour for every tenant-scoped endpoint.

        The queryset is already filtered by the TenantManager; this mixin adds the
        capability check and injects the organization on write.
      parameters:
      - in: query
        name: movement_type
        schema:
          type: string
          enum:
          - ADJUSTMENT
          - DEPOSIT
          - OPENING
          - REFUND
          - SALE
          - WITHDRAWAL
        description: |-
          * `OPENING` - Opening float
          * `SALE` - Sale
          * `REFUND` - Refund
          * `WITHDRAWAL` - Withdrawal
          * `DEPOSIT` - Deposit
          * `ADJUSTMENT` - Adjustment
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      - in: query
        name: session
        schema:
          type: string
          format: uuid
      tags:
      - cash
      security:
      - organizationJWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCashMovementList'
          description: ''
