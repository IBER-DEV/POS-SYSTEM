        schema:
          type: integer
      - in: query
        name: role
        schema:
          type: string
          enum:
          - CASHIER
          - MANAGER
          - OWNER
        description: |-
          * `OWNER` - Owner
          * `MANAGER` - Manager
          * `CASHIER` - Cashier
      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
